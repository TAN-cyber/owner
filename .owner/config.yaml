# Owner 使用的配置格式版本，请勿修改此值。
schema: owner.project.v1
# `/owner` 默认进入的工作流；该值也必须出现在 workflows 中。
default_workflow: loop
# 此项目启用的工作流，可填写 loop、pipeline 或同时启用两者。
workflows:
  - loop
  - pipeline
# 是否启用只读的环境感知恢复探针，同时作用于 Loop 和 Pipeline；设为 false 可关闭自动工作流恢复。
# ambient_resume: true | false
ambient_resume: false
# Loop 工作流配置，不会改变 Pipeline 的状态或行为。
loop:
  # Loop 规格和 change 的存放根目录；运行时数据始终位于 .owner。
  artifact_root: docs
  # Loop 工作流文档使用的产物语言。
  # 可选值：en | zh-CN
  language: zh-CN
  # Loop 提问澄清问题的方式：batch 每轮一次提出当前所有可回答的问题（默认），sequential 每轮只问一个。
  # 可选值：batch | sequential
  clarification_mode: sequential
  # Loop 归档检查成功后自动归档，或等待用户明确确认。
  # 可选值：automatic | required
  archive_confirmation: automatic
  # 同一个已确认验收目标最多允许的 Verify 失败次数；达到上限后停止完成循环。
  max_verify_failures: 5
# Pipeline 工作流配置，不会改变 Loop 的状态或行为。
pipeline:
  # Pipeline 产物布局；默认使用 docs，update 检测到根目录 legacy 产物时予以保留。
  # 可选值：legacy | docs
  artifact_layout: docs
  # Pipeline 工作流文档使用的产物语言。
  # 可选值：en | zh-CN
  language: zh-CN
  # 新建 Pipeline change 是否启用 beta 上下文压缩。
  # 可选值：off | beta
  context_compression: off
  # 新建 Pipeline change 默认使用的审查深度。
  # 可选值：off | standard | thorough
  review_mode: standard
  # Pipeline 阶段通过后是否自动进入下一阶段。
  # 可选值：true | false
  auto_transition: true
